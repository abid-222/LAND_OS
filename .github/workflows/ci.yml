name: LandOS CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-checks:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest pytest-asyncio httpx types-PyYAML PyYAML

      - name: Run Ruff Linting & Formatting
        run: |
          cd backend
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Run Mypy Type Checking
        run: |
          cd backend
          mypy app/

      - name: Run Pytest
        run: |
          cd backend
          pytest tests/ -v --cov=app

  frontend-checks:
    name: Frontend (eslint, tsc, vitest, playwright smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          npm run typecheck

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm run test:run

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium webkit

      - name: Run Playwright Smoke Test
        run: |
          cd frontend
          npm run test:e2e
