[tool.pytest.ini_options]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
